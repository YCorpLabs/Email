[package]
name = "mail-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "OAuth, Gmail API and Microsoft Graph transports for the Email engine"
readme = "README.md"
keywords = ["email", "gmail", "microsoft-graph", "oauth", "outlook"]
categories = ["email", "api-bindings", "authentication"]

[build-dependencies]
distribution-profile = { path = "../distribution-profile" }

[dependencies]
mail-core = { path = "../mail-core", version = "0.1.0" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
mailparse = "0.18"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
