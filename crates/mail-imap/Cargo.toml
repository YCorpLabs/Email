[package]
name = "mail-imap"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "TLS IMAP and SMTP adapter for the Email engine (iCloud Mail and standard servers)"
readme = "README.md"
keywords = ["email", "imap", "smtp", "icloud", "mime"]
categories = ["email", "network-programming"]

[features]
# Synthetic Gmail-like IMAP/SMTP server for tests and QA builds only. Release
# builds never enable it: it adds a trusted test certificate authority and
# endpoint redirection to the connector.
test-fixture = ["dep:rcgen", "dep:rustls", "dep:time"]

[dependencies]
mail-core = { path = "../mail-core", version = "0.1.0" }
imap = "2.4.1"
native-tls = "0.2"
mailparse = "0.18"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
time = { version = "0.3", optional = true }

[[example]]
name = "gmail_fixture"
required-features = ["test-fixture"]
