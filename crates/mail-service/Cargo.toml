[package]
name = "mail-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "Account service, credential storage and JSON/C API for Email front ends"
readme = "README.md"
keywords = ["email", "mail-client", "ffi", "keychain", "desktop"]
categories = ["email", "api-bindings", "development-tools::ffi"]

[lib]
crate-type = ["rlib", "cdylib"]

[build-dependencies]
distribution-profile = { path = "../distribution-profile" }

[features]
# QA builds only: trust the synthetic Gmail fixture and honor its endpoint
# redirect (see crates/mail-imap/src/fixture.rs). Never enabled for releases.
test-fixture = ["mail-imap/test-fixture"]

[dependencies]
mail-core = { path = "../mail-core", version = "0.1.0" }
mail-imap = { path = "../mail-imap", version = "0.1.0" }
mail-cloud = { path = "../mail-cloud", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
ammonia = "4"
base64 = "0.22"
regex = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mail-imap = { path = "../mail-imap", features = ["test-fixture"] }
