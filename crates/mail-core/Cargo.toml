[package]
name = "mail-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "Local-first mail model, SQLite cache and search for the Email engine"
readme = "README.md"
keywords = ["email", "mail", "sqlite", "offline", "search"]
categories = ["email", "database"]

[dependencies]
mailparse = "0.18"
email_address = { version = "0.2.9", default-features = false }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "hooks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dev-dependencies]
tempfile = "3"
