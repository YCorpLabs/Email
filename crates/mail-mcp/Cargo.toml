[package]
name = "mail-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "Local MCP interface to the Email mail engine"

[dependencies]
mail-core = { path = "../mail-core", version = "0.1.0" }
mail-service = { path = "../mail-service", version = "0.1.0" }
rmcp = { version = "=3.9.0", features = ["transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.41", features = ["bundled", "fallible_uint", "serialize", "hooks", "limits"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tempfile = "3"
