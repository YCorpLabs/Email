[package]
name = "mail-ai"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/YCorpLabs/Email"
description = "On-device mail sorting for Email: a small local decision model, model catalog and verified downloads"
readme = "README.md"
keywords = ["email", "classification", "local-ai", "candle"]
categories = ["email", "science"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
safetensors = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
