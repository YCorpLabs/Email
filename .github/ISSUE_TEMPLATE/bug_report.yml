name: Bug report
description: Something isn't working right.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Questions and ideas go in Discussions; security problems go in a private report.
        Remove personal data from everything you paste: no real messages, addresses, passwords or tokens.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From Commands → About Email, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Official build
        - Built from source with no distribution profile
        - A fork or another publisher's build
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Mail provider
      description: For example Gmail, iCloud or another IMAP server. No addresses.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Review them for private information before attaching.
